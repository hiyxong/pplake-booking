<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เช็กวันว่าง & จองที่พัก - PP Lake Pool Villa</title>
  <!-- Tailwind CSS & Flatpickr ปฏิทิน -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .flatpickr-calendar { margin: 0 auto; box-shadow: none; border: 1px solid #e2e8f0; border-radius: 1rem; }
    .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange { background: #0284c7 !important; border-color: #0284c7 !important; }
    .flatpickr-day.inRange { background: #e0f2fe !important; box-shadow: -5px 0 0 #e0f2fe, 5px 0 0 #e0f2fe !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-5 border border-slate-200">
    <div class="text-center mb-4">
      <h1 class="text-lg font-bold text-slate-800 tracking-wide">PP LAKE POOL VILLA</h1>
      <p class="text-xs text-slate-500 mt-1">🗓 แตะเลือกวันเช็คอิน - เช็คเอาท์</p>
    </div>

    <!-- กล่องแสดงปฏิทิน -->
    <div id="calendar-inline" class="flex justify-center mb-4 min-h-[300px] items-center text-slate-400 text-xs">
      กำลังโหลดปฏิทินวันว่าง...
    </div>

    <!-- สรุปวันที่เลือก -->
    <div class="bg-sky-50 border border-sky-100 rounded-xl p-3 mb-4 text-xs text-slate-700">
      <div class="flex justify-between items-center">
        <span class="font-medium">วันที่เลือก:</span>
        <span id="selected-dates" class="text-sky-700 font-bold">กรุณาเลือกวันที่ต้องการพัก</span>
      </div>
      <p class="mt-1 text-[11px] text-slate-400">*เช็คอิน 14:00 น. / เช็คเอาท์ 11:00 น.</p>
    </div>

    <!-- ปุ่มกดยืนยัน -->
    <button id="btn-submit" disabled 
      class="w-full bg-sky-600 hover:bg-sky-700 disabled:bg-slate-300 text-white font-semibold py-3.5 rounded-xl transition-all shadow-md text-sm">
      ยืนยันวันที่ & ขอเลขบัญชี
    </button>
  </div>

  <script>
    const MY_LIFF_ID = "2011900022-TMj4fk64";
    const ICAL_URL = "https://calendar.google.com/calendar/ical/b54a9de6795c3e12e1d8c3620dcc6149579d0364f1e131bf8685b13725df0e1d%40group.calendar.google.com/public/basic.ics";

    let chosenDates = "";
    let fpInstance = null;

    // ฟังก์ชันดึงวันติดจองจาก Google Calendar
    async function fetchBookedDates() {
      const booked = [];
      try {
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(ICAL_URL);
        const res = await fetch(proxyUrl);
        const icsData = await res.text();

        const lines = icsData.split(/\r?\n/);
        let currentStart = null;
        let currentEnd = null;

        for (let line of lines) {
          if (line.startsWith("DTSTART")) {
            const val = line.split(":")[1];
            currentStart = val ? val.substring(0, 8) : null;
          } else if (line.startsWith("DTEND")) {
            const val = line.split(":")[1];
            currentEnd = val ? val.substring(0, 8) : null;
          } else if (line.startsWith("END:VEVENT")) {
            if (currentStart) {
              const parseYMD = (s) => `${s.substring(0,4)}-${s.substring(4,6)}-${s.substring(6,8)}`;
              if (currentEnd) {
                let curr = new Date(parseYMD(currentStart));
                const stop = new Date(parseYMD(currentEnd));
                while (curr < stop) {
                  booked.push(curr.toISOString().split('T')[0]);
                  curr.setDate(curr.getDate() + 1);
                }
              } else {
                booked.push(parseYMD(currentStart));
              }
            }
            currentStart = null;
            currentEnd = null;
          }
        }
      } catch (err) {
        console.error("Error fetching iCal:", err);
      }
      return booked;
    }

    async function initApp() {
      // 1. ดึงวันติดจองจาก Google Calendar ของลูกพี่
      const bookedDates = await fetchBookedDates();

      // 2. เคลียร์ข้อความกำลังโหลด แล้วสร้างปฏิทิน
      document.getElementById('calendar-inline').innerHTML = '';
      fpInstance = flatpickr("#calendar-inline", {
        inline: true,
        mode: "range",
        minDate: "today",
        dateFormat: "Y-m-d",
        disable: bookedDates,
        onChange: function(selectedDates) {
          if (selectedDates.length === 2) {
            const d1 = selectedDates[0].getDate() + '/' + (selectedDates[0].getMonth() + 1) + '/' + (selectedDates[0].getFullYear() + 543);
            const d2 = selectedDates[1].getDate() + '/' + (selectedDates[1].getMonth() + 1) + '/' + (selectedDates[1].getFullYear() + 543);
            chosenDates = `${d1} - ${d2}`;
            document.getElementById('selected-dates').innerText = chosenDates;
            document.getElementById('btn-submit').disabled = false;
          } else {
            document.getElementById('btn-submit').disabled = true;
          }
        }
      });

      // 3. เริ่มเชื่อมต่อ LIFF
      liff.init({ liffId: MY_LIFF_ID }).catch(err => console.log(err));

      // 4. ปุ่มกดยืนยัน ส่งข้อความเข้า LINE
      document.getElementById('btn-submit').addEventListener('click', async () => {
        if (!chosenDates) return;

        const msg1 = `สนใจจองที่พัก PP Lake Pool Villa\n🗓 วันที่: ${chosenDates}`;
        const msg2 = `ขอเลขบัญชีโอนมัดจำ`;

        if (liff.isLoggedIn() && liff.isInClient()) {
          try {
            await liff.sendMessages([
              { type: 'text', text: msg1 },
              { type: 'text', text: msg2 }
            ]);
            liff.closeWindow();
          } catch (e) {
            alert("ไม่สามารถส่งข้อความได้: " + e.message);
          }
        } else {
          alert("กรุณาเปิดลิงก์นี้ผ่าน LINE เท่านั้นครับ");
        }
      });
    }

    initApp();
  </script>
</body>
</html>
