<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PP LAKE POOL VILLA</title>
  <!-- Tailwind CSS & Flatpickr -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    .flatpickr-calendar { 
      margin: 0 auto; 
      box-shadow: none; 
      border: 1px solid #e2e8f0; 
      border-radius: 1rem; 
    }
    .flatpickr-day.selected { 
      background: #0284c7 !important; 
      border-color: #0284c7 !important; 
    }
    .flatpickr-day.prevMonthDay,
    .flatpickr-day.nextMonthDay {
      display: none !important;
    }
    /* สีส้มวันติดจอง */
    .flatpickr-day.booked-orange {
      background-color: #f97316 !important;
      color: #ffffff !important;
      border-color: #ea580c !important;
      cursor: not-allowed !important;
      opacity: 0.95 !important;
      pointer-events: none !important;
      border-radius: 8px !important;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-5 border border-slate-200">
    <div class="text-center mb-3">
      <h1 class="text-lg font-bold text-slate-800 tracking-wide">PP LAKE POOL VILLA</h1>
      <p class="text-xs text-slate-500 mt-1">🗓 แตะเลือกวันที่ต้องการเข้าพัก (Check-in Date)</p>
    </div>

    <!-- กล่องปฏิทิน -->
    <div id="calendar-inline" class="flex justify-center mb-2"></div>

    <!-- คำอธิบายสถานะ -->
    <div class="flex items-center justify-center gap-4 py-2 px-3 mb-3 bg-slate-50 border border-slate-100 rounded-xl text-xs text-slate-600">
      <div class="flex items-center gap-1.5">
        <span class="w-3.5 h-3.5 rounded-md bg-white border border-slate-300 shadow-sm inline-block"></span>
        <span>สีขาว : ว่าง (Available)</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="w-3.5 h-3.5 rounded-md bg-orange-500 border border-orange-600 shadow-sm inline-block"></span>
        <span class="font-medium text-orange-700">สีส้ม : ติดจอง (Booked)</span>
      </div>
    </div>

    <!-- เลือกจำนวนคืน และ จำนวนผู้เข้าพัก -->
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">🌙 จำนวนคืน / Nights:</label>
        <select id="night-count" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-2.5 text-xs text-slate-800 focus:outline-none focus:border-sky-500">
          <option value="1" selected>1 คืน (Night)</option>
          <option value="2">2 คืน (Nights)</option>
          <option value="3">3 คืน (Nights)</option>
          <option value="4">4 คืน (Nights)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">👥 ผู้เข้าพัก / Guests:</label>
        <select id="guest-count" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-2.5 text-xs text-slate-800 focus:outline-none focus:border-sky-500">
          <option value="1 - 4 ท่าน">1 - 4 ท่าน</option>
          <option value="5 - 8 ท่าน" selected>5 - 8 ท่าน</option>
          <option value="9 - 10 ท่าน">9 - 10 ท่าน</option>
          <option value="11 - 12 ท่าน">11 - 12 ท่าน</option>
          <option value="มากกว่า 12 ท่าน">มากกว่า 12 ท่าน</option>
        </select>
      </div>
    </div>

    <!-- สรุปข้อมูลการจอง -->
    <div class="bg-sky-50 border border-sky-100 rounded-xl p-3 mb-4 text-xs text-slate-700">
      <div class="flex justify-between items-center mb-1">
        <span class="font-medium">วันเข้าพัก - เช็คเอาท์:</span>
        <span id="selected-dates" class="text-sky-700 font-bold">กรุณาแตะเลือกวันบนปฏิทิน</span>
      </div>
      <p class="text-[11px] text-slate-500">⏰ เช็คอิน 14:00 น. | เช็คเอาท์ 11:00 น.</p>
    </div>

    <!-- ปุ่มส่งข้อความ -->
    <button id="btn-submit" disabled 
      class="w-full bg-sky-600 hover:bg-sky-700 disabled:bg-slate-300 text-white font-semibold py-3.5 rounded-xl transition-all shadow-md text-sm flex flex-col items-center justify-center leading-tight">
      <span>ยืนยันวันที่ & ขอเลขบัญชี</span>
      <span class="text-[11px] font-normal opacity-90">Confirm Dates & Payment Details</span>
    </button>
  </div>

  <script>
    const MY_LIFF_ID = "2011900022-TMj4fk64";

    const BOOKED_LIST = [
      // ต.ค. 2026
      "2026-10-10", "2026-10-11", "2026-10-12", "2026-10-13", "2026-10-14",
      "2026-10-16", "2026-10-17", "2026-10-18", "2026-10-19", "2026-10-20",
      "2026-10-21", "2026-10-22", "2026-10-23", "2026-10-24", "2026-10-25",
      "2026-10-26", "2026-10-27", "2026-10-28", "2026-10-29", "2026-10-30", "2026-10-31",

      // พ.ย. 2026
      "2026-11-01", "2026-11-03",
      "2026-11-05", "2026-11-06", "2026-11-07", "2026-11-08", "2026-11-09",
      "2026-11-12", "2026-11-13", "2026-11-14", "2026-11-15",
      "2026-11-20", "2026-11-21", "2026-11-22",
      "2026-11-25", "2026-11-26", "2026-11-27", "2026-11-28", "2026-11-29", "2026-11-30",

      // ธ.ค. 2026
      "2026-12-04", "2026-12-05", "2026-12-06",
      "2026-12-11", "2026-12-12", "2026-12-19",
      "2026-12-25", "2026-12-26", "2026-12-30", "2026-12-31"
    ];

    const bookedSet = new Set(BOOKED_LIST);
    let selectedCheckInDate = null;
    let finalSummaryText = "";

    function formatThaiDate(d) {
      return d.getDate() + '/' + (d.getMonth() + 1) + '/' + (d.getFullYear() + 543);
    }

    function updateBookingDisplay() {
      if (!selectedCheckInDate) return;
      const nights = parseInt(document.getElementById('night-count').value);
      
      const checkOutDate = new Date(selectedCheckInDate);
      checkOutDate.setDate(checkOutDate.getDate() + nights);

      const inStr = formatThaiDate(selectedCheckInDate);
      const outStr = formatThaiDate(checkOutDate);

      finalSummaryText = `${inStr} - ${outStr} (${nights} คืน)`;
      document.getElementById('selected-dates').innerText = finalSummaryText;
      document.getElementById('btn-submit').disabled = false;
    }

    flatpickr("#calendar-inline", {
      inline: true,
      minDate: "today",
      dateFormat: "Y-m-d",
      disable: BOOKED_LIST,
      onDayCreate: function(dObj, dStr, fp, dayElem) {
        if (dayElem.classList.contains("prevMonthDay") || dayElem.classList.contains("nextMonthDay")) {
          dayElem.style.display = "none";
          return;
        }

        const d = dayElem.dateObj;
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const formatted = `${year}-${month}-${day}`;

        if (bookedSet.has(formatted)) {
          dayElem.classList.add("booked-orange");
          dayElem.setAttribute("title", "ติดจองแล้ว (Booked)");
        }
      },
      onChange: function(selectedDates) {
        if (selectedDates.length > 0) {
          selectedCheckInDate = selectedDates[0];
          updateBookingDisplay();
        }
      }
    });

    document.getElementById('night-count').addEventListener('change', updateBookingDisplay);

    liff.init({ liffId: MY_LIFF_ID }).catch(err => console.log(err));

    document.getElementById('btn-submit').addEventListener('click', async () => {
      if (!selectedCheckInDate) return;
      const guests = document.getElementById('guest-count').value;

      const msg1 = `สนใจจองที่พัก: PP Lake Pool Villa\n🗓 วันที่: ${finalSummaryText}\n⏰ เช็คอิน: 14:00 น. | เช็คเอาท์: 11:00 น.\n👥 จำนวนผู้เข้าพัก: ${guests}`;
      const msg2 = `ขอเลขบัญชีโอนมัดจำ/Payment`;

      if (liff.isLoggedIn() && liff.isInClient()) {
        try {
          await liff.sendMessages([
            { type: 'text', text: msg1 },
            { type: 'text', text: msg2 }
          ]);
          liff.closeWindow();
        } catch (e) {
          alert("ไม่สามารถส่งข้อความได้: " + e.message);
        }
      } else {
        alert("กรุณาเปิดลิงก์นี้ผ่าน LINE / Please open via LINE");
      }
    });
  </script>
</body>
</html>
